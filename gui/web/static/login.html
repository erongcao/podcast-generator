<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 · Podcast Generator</title>
    <link rel="stylesheet" href="/static/css/theme.css">
    <link rel="stylesheet" href="/static/css/login.css">
</head>
<body>
    <div class="login-container">
        <h1 class="login-title">🎙️ Podcast Generator</h1>
        <p class="login-subtitle">登录以管理你的脚本和音色库</p>

        <div class="login-tabs">
            <button id="tab-login-btn" class="tab-btn active" type="button">登录</button>
            <button id="tab-register-btn" class="tab-btn" type="button">注册</button>
        </div>

        <!-- 登录表单 -->
        <form id="login-form" class="login-form">
            <label>
                <span>用户名</span>
                <input type="text" name="username" required minlength="4" autocomplete="username">
            </label>
            <label>
                <span>密码</span>
                <input type="password" name="password" required minlength="8" autocomplete="current-password">
            </label>
            <button type="submit" class="btn btn-primary btn-block">登录</button>
            <p id="login-error" class="login-error" hidden></p>
        </form>

        <!-- 注册表单 -->
        <form id="register-form" class="login-form" hidden>
            <label>
                <span>用户名 <em>(≥4 字符)</em></span>
                <input type="text" name="username" required minlength="4" autocomplete="username">
            </label>
            <label>
                <span>密码 <em>(≥8 字符)</em></span>
                <input type="password" name="password" required minlength="8" autocomplete="new-password">
            </label>
            <label>
                <span>邮箱 <em>(可选)</em></span>
                <input type="email" name="email" autocomplete="email">
            </label>
            <label>
                <span>显示名 <em>(可选)</em></span>
                <input type="text" name="display_name" maxlength="128">
            </label>
            <button type="submit" class="btn btn-primary btn-block">注册</button>
            <p id="register-error" class="login-error" hidden></p>
        </form>

        <p class="login-foot">
            <a href="/">← 返回主页</a>
        </p>
    </div>
    <script src="/static/js/login.js"></script>
</body>
</html>
